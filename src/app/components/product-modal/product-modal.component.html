<ion-content class="ion-padding">
  <div class="product-modal-content">
    <!-- Imagen del producto -->
    <div class="product-image-container">
      <img [src]="product.imageUrl" [alt]="product.name" (error)="handleImageError($event)" loading="lazy">
      <ion-button (click)="dismiss()" class="close-button" fill="clear">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </div>

    <!-- Información del producto -->
    <div class="product-info">
      <h2>{{ product.name }}</h2>
      <p class="description">{{ product.description }}</p>
      
      <!-- Precio y oferta -->
      <div class="price-container">
        <div class="price" [class.has-offer]="product.isOffer">
          <span class="original-price" *ngIf="product.isOffer">{{ product.price | currency:'EUR' }}</span>
          <span class="current-price">{{ (product.offerPrice || product.price) | currency:'EUR' }}</span>
        </div>
        <div class="discount-badge" *ngIf="product.isOffer && product.offerPrice">
          -{{ calculateDiscount(product.price, product.offerPrice) }}%
        </div>
      </div>

      <!-- Selector de cantidad -->
      <div class="quantity-selector">
        <ion-button (click)="decrementQuantity()" [disabled]="quantity <= 1">
          <ion-icon name="remove"></ion-icon>
        </ion-button>
        <span class="quantity">{{ quantity }}</span>
        <ion-button (click)="incrementQuantity()" [disabled]="quantity >= 10">
          <ion-icon name="add"></ion-icon>
        </ion-button>
      </div>

      <!-- Botón de añadir al carrito -->
      <ion-button expand="block" (click)="addToCart()" class="add-to-cart-button">
        <ion-icon name="cart"></ion-icon>
        {{ isInCart ? 'Actualizar carrito' : 'Añadir al carrito' }}
      </ion-button>
    </div>
  </div>
</ion-content>
