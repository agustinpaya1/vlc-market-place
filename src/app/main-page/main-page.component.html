<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Marketplace</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="isMenuOpen = true">
        <ion-icon name="ellipsis-vertical" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="main-page-container">
    <div class="header-section">
      <h1 class="title">Welcome to Our Store</h1>
      <p class="subtitle">Explore our exclusive range of products</p>
    </div>

    <ion-grid>
      <ion-row>
        <ion-col size="12" size-md="6" size-lg="4" *ngFor="let product of products">
          <ion-card>
            <div class="image-container">
              <ion-img [src]="product.imageUrl" alt="{{ product.name }}"></ion-img>
            </div>
            <ion-card-header>
              <ion-card-title>{{ product.name }}</ion-card-title>
              <ion-card-subtitle>${{ product.price }}</ion-card-subtitle>
            </ion-card-header>
            <ion-card-content>
              <p>{{ product.description }}</p>
            </ion-card-content>
            <div class="cart-button-container">
              <ion-button expand="block" (click)="addToCart(product)">
                <ion-icon name="cart" slot="start"></ion-icon>
                Add to Cart
              </ion-button>
              <ion-badge *ngIf="getProductQuantity(product.id) > 0" color="primary" class="cart-badge">
                {{ getProductQuantity(product.id) }}
              </ion-badge>
            </div>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <ion-popover [isOpen]="isMenuOpen" (didDismiss)="isMenuOpen = false">
    <ng-template>
      <ion-list>
        <ion-item *ngIf="isAuthenticated && currentUser" lines="none">
          <ion-avatar slot="start">
            <ion-icon name="person-circle" size="large"></ion-icon>
          </ion-avatar>
          <ion-label>
            <h2>Bienvenido</h2>
            <p>{{ currentUser.email }}</p>
          </ion-label>
        </ion-item>
        <ion-item button (click)="onLogin()" *ngIf="!isAuthenticated">
          <ion-icon name="log-in" slot="start"></ion-icon>
          <ion-label>Login</ion-label>
        </ion-item>
        <ion-item button (click)="onRegister()" *ngIf="!isAuthenticated">
          <ion-icon name="person-add" slot="start"></ion-icon>
          <ion-label>Registro</ion-label>
        </ion-item>
        <ion-item button (click)="onLogout()" *ngIf="isAuthenticated">
          <ion-icon name="log-out" slot="start"></ion-icon>
          <ion-label>Logout</ion-label>
        </ion-item>
      </ion-list>
    </ng-template>
  </ion-popover>
</ion-content>
