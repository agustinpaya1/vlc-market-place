<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab3" routerLink="/tabs/tab3">
      <ion-icon aria-hidden="true" name="storefront"></ion-icon>
      <ion-label>Marketplace</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab4" routerLink="/tabs/tab4">
      <ion-icon aria-hidden="true" name="business"></ion-icon>
      <ion-label>Tiendas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab5" routerLink="/tabs/tab5">
      <ion-icon aria-hidden="true" name="map"></ion-icon>
      <ion-label>Mapa</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab6" routerLink="/tabs/tab6">
      <ion-icon aria-hidden="true" name="settings"></ion-icon>
      <ion-label>Configuración</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="cart" routerLink="/tabs/cart">
      <ion-icon aria-hidden="true" name="cart"></ion-icon>
      <ion-label>Carrito</ion-label>
      <ion-badge *ngIf="cartService.getTotalItems() > 0" color="danger" class="cart-badge">
        {{ cartService.getTotalItems() }}
      </ion-badge>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
