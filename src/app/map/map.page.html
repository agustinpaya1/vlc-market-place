<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mapa de Tiendas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-no-padding">
  <!-- Mapa a pantalla completa -->
  <div id="mapbox-map" class="fullscreen-map"></div>

  <!-- Bottom Sheet deslizable -->
  <div class="bottom-sheet" [class.active]="isBottomSheetActive">
    <div class="bottom-sheet-handle" (click)="toggleBottomSheet()">
      <div class="handle-bar"></div>
    </div>
    
    <!-- Barra de búsqueda -->
    <div class="search-section">
      <ion-searchbar placeholder="Buscar mercados..." mode="ios"></ion-searchbar>
    </div>

    <!-- Lista de tiendas -->
    <div class="stores-list">
      <div class="store-item" *ngFor="let store of stores" (click)="focusOnStore(store)">
        <h2>{{store.name}}</h2>
        <p class="distance">
          <ion-icon name="location-outline"></ion-icon>
          {{store.distance}} km
        </p>
        <p>
          <ion-icon name="time-outline"></ion-icon>
          {{store.schedule}}
        </p>
        <p>
          <ion-icon name="call-outline"></ion-icon>
          {{store.phone}}
        </p>
        <div class="status-chip" [class.open]="store.isOpen">
          <ion-icon [name]="store.isOpen ? 'checkmark-circle' : 'close-circle'"></ion-icon>
          <span>{{store.isOpen ? 'Abierto' : 'Cerrado'}}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Botón de filtros flotante -->
  <ion-fab vertical="top" horizontal="end" slot="fixed">
    <ion-fab-button (click)="toggleFilters()">
      <ion-icon name="options-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- Modal de filtros -->
  <ion-modal [isOpen]="showFilters" [breakpoints]="[0, 0.5, 0.8]" [initialBreakpoint]="0.5" (didDismiss)="toggleFilters()">
    <ng-template>
      <ion-header class="ion-no-border">
        <ion-toolbar>
          <ion-title>Filtros</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="toggleFilters()">
              <ion-icon name="close-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list>
          <ion-item>
            <ion-label>Mostrar solo abiertos</ion-label>
            <ion-toggle [(ngModel)]="showOnlyOpen"></ion-toggle>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Distancia máxima: {{maxDistance}}km</ion-label>
            <ion-range min="1" max="20" step="1" [(ngModel)]="maxDistance">
              <ion-label slot="start">1km</ion-label>
              <ion-label slot="end">20km</ion-label>
            </ion-range>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Categorías</ion-label>
            <ion-select multiple="true" [(ngModel)]="selectedCategories">
              <ion-select-option value="food">Alimentación</ion-select-option>
              <ion-select-option value="clothing">Ropa</ion-select-option>
              <ion-select-option value="electronics">Electrónica</ion-select-option>
            </ion-select>
          </ion-item>
        </ion-list>

        <div class="ion-padding">
          <ion-button expand="block" (click)="applyFilters()">
            Aplicar Filtros
          </ion-button>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
