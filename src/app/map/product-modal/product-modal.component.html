<ion-content class="ion-padding">
  <div class="drag-indicator"></div>
  <div class="product-image-container">
    <!-- Botones de acción sobre la imagen -->
    <div class="image-actions">
      <ion-button fill="clear" class="close-button" (click)="dismiss()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </div>
    <ion-img [src]="product.imageUrl || product.image_url" [alt]="product.name" (error)="handleImageError($event)"></ion-img>
  </div>

  <div class="product-details">
    <h2>{{ product.name }}</h2>
    
    <div class="price-container">
      <ng-container *ngIf="product.offerPrice !== undefined; else normalPrice">
        <div class="offer-price">
          <span class="original-price">{{ product.price | currency:'EUR' }}</span>
          <span class="final-price">{{ product.offerPrice | currency:'EUR' }}</span>
        </div>
      </ng-container>
      <ng-template #normalPrice>
        <span class="price">{{ product.price | currency:'EUR' }}</span>
      </ng-template>
    </div>

    <p class="description">{{ product.description }}</p>

    <div class="quantity-selector">
      <ion-button 
        fill="outline" 
        color="primary" 
        (click)="decrementQuantity()" 
        [disabled]="quantity === 0">
        <ion-icon name="remove"></ion-icon>
      </ion-button>
      <span class="quantity">{{ quantity }}</span>
      <ion-button 
        fill="outline" 
        color="primary" 
        (click)="incrementQuantity()">
        <ion-icon name="add"></ion-icon>
      </ion-button>
    </div>

    <ion-button expand="block" (click)="addToCart()" [disabled]="quantity === 0">
      <ion-icon name="cart" slot="start"></ion-icon>
      {{ isInCart ? 'Actualizar carrito' : 'Añadir al carrito' }}
    </ion-button>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-button *ngIf="isInCart" expand="block" (click)="dismiss()" color="medium">
      Cerrar
    </ion-button>
  </ion-toolbar>
</ion-footer>
