<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/profile"></ion-back-button>
    </ion-buttons>
    <ion-title>Configuración</ion-title>
    <ion-buttons slot="end">
      <img src="https://yftetqhpxurrndkehoeg.supabase.co/storage/v1/object/public/logoapp//logo.png" 
           alt="Logo" 
           class="header-logo"
           (error)="handleImageError($event)">
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-background">
    <div class="accent-circle circle-1"></div>
    <div class="accent-circle circle-2"></div>
  </div>
  
  <div class="settings-container">
    <div class="secure-banner">
      <div class="icon-container">
        <ion-icon name="settings-outline"></ion-icon>
      </div>
      <div class="secure-text">
        <h3>Configuración</h3>
        <p>Personaliza tu experiencia en la app</p>
      </div>
    </div>
    
    <!-- Soporte y Ayuda -->
    <div class="section-container">
      <div class="section-header">
        <h2>Soporte</h2>
      </div>
      
      <div class="settings-card">
        <div class="setting-item" (click)="openHelp()">
          <div class="setting-info">
            <ion-icon name="help-circle-outline"></ion-icon>
            <div class="setting-text">
              <h3>Ayuda</h3>
              <p>Preguntas frecuentes</p>
            </div>
          </div>
          <ion-icon name="chevron-forward" class="arrow-icon"></ion-icon>
        </div>
        
        <div class="divider"></div>
        
        <div class="setting-item" (click)="showAppInfo()">
          <div class="setting-info">
            <ion-icon name="information-circle-outline"></ion-icon>
            <div class="setting-text">
              <h3>Acerca de</h3>
              <p>Información sobre la app</p>
            </div>
          </div>
          <ion-icon name="chevron-forward" class="arrow-icon"></ion-icon>
        </div>
      </div>
    </div>
    
    <!-- Botón de cerrar sesión -->
    <div class="logout-container">
      <ion-button (click)="logout()" fill="outline" color="danger" class="logout-button">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        <span>Cerrar sesión</span>
      </ion-button>
    </div>
  </div>
</ion-content>
