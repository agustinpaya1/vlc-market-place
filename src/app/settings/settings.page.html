<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Configuración</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- User Menu List -->
  <ion-list>
    <ion-item class="custom-item">
      <ion-icon name="notifications" slot="start"></ion-icon>
      <ion-label>Notificaciones push</ion-label>
      <ion-toggle slot="end"></ion-toggle>
    </ion-item>
    
    <ion-item class="custom-item">
      <ion-icon name="language" slot="start"></ion-icon>
      <ion-label>Idioma</ion-label>
      <ion-select interface="popover" value="es" slot="end">
        <ion-select-option value="es">Español</ion-select-option>
        <ion-select-option value="en">English</ion-select-option>
      </ion-select>
    </ion-item>
  </ion-list>

  <!-- Settings Section -->
  <div class="settings-section">
    <div class="section-content">
      <ion-item>
        <ion-icon slot="start" name="notifications"></ion-icon>
        <ion-label>
          <h4>Notificaciones Push</h4>
          <p>Recibe notificaciones de tus pedidos</p>
        </ion-label>
        <ion-toggle slot="end"></ion-toggle>
      </ion-item>
    </div>
  </div>
</ion-content>
