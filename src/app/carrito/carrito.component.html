<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrowBack" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Mi Carrito</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="cart-container">
    <div *ngIf="cartItems.length === 0" class="empty-cart">
      <ion-card>
        <ion-card-header>
          <ion-card-title>Tu carrito está vacío</ion-card-title>
          <ion-card-subtitle>Agrega productos para comenzar a comprar</ion-card-subtitle>
        </ion-card-header>
      </ion-card>
    </div>

    <ion-list *ngIf="cartItems.length > 0">
      <ion-item *ngFor="let item of cartItems">
        <ion-grid>
          <ion-row class="ion-align-items-center">
            <ion-col size="3">
              <ion-img [src]="item.imageUrl" [alt]="item.name"></ion-img>
            </ion-col>
            <ion-col size="6">
              <ion-label>
                <h2>{{ item.name }}</h2>
                <p>${{ item.price }}</p>
              </ion-label>
            </ion-col>
            <ion-col size="3">
              <div class="quantity-controls">
                <ion-button fill="clear" (click)="updateQuantity(item, -1)">
                  <ion-icon name="remove"></ion-icon>
                </ion-button>
                <ion-label>{{ item.quantity }}</ion-label>
                <ion-button fill="clear" (click)="updateQuantity(item, 1)">
                  <ion-icon name="add"></ion-icon>
                </ion-button>
              </div>
            </ion-col>
          </ion-row>
        </ion-grid>
        <ion-button fill="clear" slot="end" (click)="removeItem(item.id)">
          <ion-icon name="trash" color="danger"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-list>

    <div *ngIf="cartItems.length > 0" class="cart-total">
      <ion-card>
        <ion-card-header>
          <ion-card-title>Resumen del Pedido</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <p class="total">Total: ${{ totalPrice }}</p>
          <ion-button expand="block" color="primary" (click)="proceedToCheckout()">
            Proceder al Pago
          </ion-button>
        </ion-card-content>
      </ion-card>
    </div>
  </div>
</ion-content>
