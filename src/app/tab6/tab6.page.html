<ion-header>
  <ion-toolbar>
    <ion-title>Tiendas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <h1 class="page-title">Explora Nuestras Tiendas</h1>
  <p class="page-subtitle">Descubre los mejores comercios locales de Valencia</p>

  <div class="filters-container">
    <div class="categories-container">
      <ion-chip 
        *ngFor="let category of categories" 
        [color]="selectedCategory === category ? 'primary' : 'medium'"
        (click)="selectCategory(category)"
        class="category-chip"
      >
        {{ category }}
      </ion-chip>
    </div>

    <div class="sort-container">
      <ion-select 
        [(ngModel)]="selectedSort" 
        (ionChange)="selectSort($event.detail.value)"
        interface="popover"
        class="sort-select"
      >
        <ion-select-option *ngFor="let option of sortOptions" [value]="option.value">
          <ion-icon [name]="option.icon"></ion-icon>
          {{ option.label }}
        </ion-select-option>
      </ion-select>
    </div>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let store of filteredStores">
        <ion-card class="store-card">
          <img [src]="store.imageUrl" [alt]="store.name" class="store-image" (error)="handleImageError($event)">
          <ion-card-header>
            <ion-card-subtitle>
              <ion-chip *ngFor="let category of store.categories" color="primary" class="store-category-chip">
                {{ category }}
              </ion-chip>
              <ion-chip *ngIf="store.hasOffers" color="warning" class="store-category-chip">
                <ion-icon name="trendingUp"></ion-icon>
                Ofertas
              </ion-chip>
            </ion-card-subtitle>
            <ion-card-title>{{ store.name }}</ion-card-title>
          </ion-card-header>
          <div class="store-info">
            <div class="info-item">
              <ion-icon name="location"></ion-icon>
              <ion-label>{{ store.location }} ({{ store.distance }}km)</ion-label>
            </div>
            <div class="info-item">
              <ion-icon name="time"></ion-icon>
              <ion-label>{{ store.openTime }}</ion-label>
            </div>
            <div class="info-item">
              <ion-icon name="storefront"></ion-icon>
              <ion-label>{{ store.description }}</ion-label>
            </div>
            <div class="rating">
              <ion-icon name="star"></ion-icon>
              <ion-label>{{ store.rating }}</ion-label>
            </div>
          </div>
          <ion-button expand="block" class="view-button" (click)="viewStore(store.id)">
            Ver Productos
            <ion-icon name="arrowForward" slot="end"></ion-icon>
          </ion-button>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
