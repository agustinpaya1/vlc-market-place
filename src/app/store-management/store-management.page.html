<ion-header>
  <ion-toolbar>
    <ion-title>Administración de Tiendas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Bienvenido a la Administración</ion-card-title>
      <ion-card-subtitle>Gestiona tus tiendas desde aquí</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <p>Desde este panel podrás:</p>
      <ion-list>
        <ion-item>
          <ion-icon name="add-circle-outline" slot="start"></ion-icon>
          <ion-label>Crear nuevas tiendas</ion-label>
        </ion-item>
        <ion-item>
          <ion-icon name="create-outline" slot="start"></ion-icon>
          <ion-label>Editar tiendas existentes</ion-label>
        </ion-item>
        <ion-item>
          <ion-icon name="bag-check-outline" slot="start"></ion-icon>
          <ion-label>Gestionar productos</ion-label>
        </ion-item>
        <ion-item>
          <ion-icon name="receipt-outline" slot="start"></ion-icon>
          <ion-label>Ver pedidos</ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button>
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
