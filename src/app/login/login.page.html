<ion-content [fullscreen]="true" class="ion-padding">
  <div class="login-container">
    <h1 class="title">Bienvenido de nuevo</h1>
    <p class="subtitle">Inicia sesión para continuar</p>

    <form class="login-form" (ngSubmit)="login()">
      <ion-item>
        <ion-label position="stacked">Email</ion-label>
        <ion-input 
          type="email" 
          [(ngModel)]="email" 
          name="email"
          placeholder="tucorreo@ejemplo.com">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Contraseña</ion-label>
        <ion-input 
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          placeholder="********">
        </ion-input>
        <ion-icon 
          [name]="showPassword ? 'eye-outline' : 'eye-off-outline'" 
          slot="end"
          (click)="togglePassword()">
        </ion-icon>
      </ion-item>

      <div class="forgot-password">
        <a (click)="forgotPassword()">¿Olvidaste tu contraseña?</a>
      </div>

      <ion-button expand="block" type="submit" class="login-btn">
        Iniciar sesión
      </ion-button>

      <div class="divider">
        <span>O continúa con</span>
      </div>

      <div class="social-buttons">
        <ion-button fill="outline" class="google-btn" (click)="loginWithGoogle()">
          <ion-icon name="logo-google" slot="start"></ion-icon>
          Google
        </ion-button>
        <ion-button fill="outline" class="facebook-btn" (click)="loginWithFacebook()">
          <ion-icon name="logo-facebook" slot="start"></ion-icon>
          Facebook
        </ion-button>
      </div>

      <p class="register-text">
        ¿No tienes una cuenta? <a (click)="goToRegister()">Regístrate</a>
      </p>
    </form>
  </div>
</ion-content>
