<ion-content [fullscreen]="true" class="ion-padding">
  <div class="login-container">
    <h1 class="title">Sign in to your Account</h1>
    <p class="subtitle">Sign in to your Account</p>

    <form class="login-form" (ngSubmit)="login()">
      <ion-item>
        <ion-label position="stacked">Email</ion-label>
        <ion-input 
          type="email" 
          [(ngModel)]="email" 
          name="email"
          placeholder="ferdinand@gmail.com">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Password</ion-label>
        <ion-input 
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          placeholder="********">
        </ion-input>
        <ion-icon 
          [name]="showPassword ? 'eye-outline' : 'eye-off-outline'" 
          slot="end"
          (click)="togglePassword()">
        </ion-icon>
      </ion-item>

      <div class="forgot-password">
        <a (click)="forgotPassword()">Forgot Password?</a>
      </div>

      <ion-button expand="block" type="submit" class="login-btn">
        Login
      </ion-button>

      <div class="divider">
        <span>Or login with</span>
      </div>

      <div class="social-buttons">
        <ion-button fill="outline" class="google-btn" (click)="loginWithGoogle()">
          <ion-icon name="logo-google" slot="start"></ion-icon>
          Google
        </ion-button>
        <ion-button fill="outline" class="facebook-btn" (click)="loginWithFacebook()">
          <ion-icon name="logo-facebook" slot="start"></ion-icon>
          Facebook
        </ion-button>
        <ion-button fill="outline" class="apple-btn" (click)="loginWithApple()">
          <ion-icon name="logo-apple" slot="start"></ion-icon>
          Apple
        </ion-button>
        <ion-button fill="outline" class="twitter-btn" (click)="loginWithTwitter()">
          <ion-icon name="logo-twitter" slot="start"></ion-icon>
          Twitter
        </ion-button>
      </div>

      <p class="register-text">
        Don't have an account? <a (click)="goToRegister()">Register</a>
      </p>
    </form>
  </div>
</ion-content>
