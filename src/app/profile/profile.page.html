<ion-content class="ion-padding">
  <!-- Contenido cuando el usuario está autenticado -->
  <div *ngIf="isAuthenticated">
    <div class="user-profile-header">
      <div class="user-avatar-container">
        <!-- User avatar with comprehensive error handling -->
        <ng-container *ngIf="user.photoUrl; else defaultAvatar">
          <img 
            [src]="user.photoUrl" 
            class="user-avatar-image" 
            (error)="onImageError($event)"
            alt="Foto de perfil del usuario"
            loading="lazy"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
          >
        </ng-container>
        <ng-template #defaultAvatar>
          <img 
            src="assets/default-profile.svg" 
            class="user-avatar-image" 
            alt="Avatar por defecto"
          >
        </ng-template>
        
        <!-- Botón de carga de foto -->
        <ion-button 
          fill="clear" 
          class="user-photo-upload-button" 
          (click)="fileInput.click()"
        >
          <ion-icon name="camera" slot="icon-only"></ion-icon>
        </ion-button>
        
        <!-- Input de archivo oculto -->
        <input 
          #fileInput 
          type="file" 
          accept="image/*" 
          (change)="onPhotoUpload($event)" 
          style="display: none"
        >
        
        <!-- Botón de edición de perfil -->
        <ion-button 
          fill="clear" 
          class="user-edit-button" 
          (click)="editProfile()"
        >
          <ion-icon name="pencil" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
      <h2 class="user-fullname">{{ user.name }}</h2>
      <p class="user-email-text">{{ user.email }}</p>
    </div>

    <ion-list lines="full" class="user-info-list">
      <ion-item>
        <ion-icon name="call-outline" slot="start"></ion-icon>
        <ion-label>
          <p>Teléfono</p>
          <h3>{{ user.phone }}</h3>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-icon name="location-outline" slot="start"></ion-icon>
        <ion-label>
          <p>Dirección</p>
          <h3>{{ user.address }}</h3>
        </ion-label>
      </ion-item>
    </ion-list>

    <ion-list lines="full" class="user-menu-list">
      <ion-item *ngFor="let item of menuItems" (click)="navigate(item.route)" detail>
        <ion-icon [name]="item.icon" slot="start"></ion-icon>
        <ion-label>{{ item.label }}</ion-label>
      </ion-item>
    </ion-list>

    <div class="user-actions-container">
      <ion-button expand="block" color="danger" class="logout-button" (click)="logout()">
        CERRAR SESIÓN
      </ion-button>
    </div>
  </div>

  <!-- Contenido cuando el usuario NO está autenticado -->
  <div *ngIf="!isAuthenticated" class="not-authenticated-container">
    <div class="app-logo">
      <img [src]="logoUrl" alt="VLC Marketplace" class="transparent-logo" (error)="onImageError($event)">
      <h1>VLC Marketplace</h1>
    </div>
    
    <div class="login-prompt-card">
      <ion-icon name="personCircle" class="large-profile-icon"></ion-icon>
      <h2>¡Bienvenido!</h2>
      <p>Inicia sesión para acceder a tu perfil, pedidos y más</p>
      <ion-button expand="block" color="primary" (click)="goToLogin()">
        <ion-icon name="log-in-outline" slot="start"></ion-icon>
        Iniciar Sesión
      </ion-button>
      <p class="register-prompt">¿No tienes cuenta? <a (click)="goToRegister()">Regístrate</a></p>
    </div>
  </div>
</ion-content>
