<ion-content>
  <!-- Contenido cuando el usuario está autenticado -->
  <div *ngIf="isAuthenticated" class="ion-padding hardware-accelerated">
    <div class="user-profile-header">
      <div class="user-avatar-container hardware-accelerated">
        <!-- User avatar with comprehensive error handling -->
        <ng-container *ngIf="user.photoUrl; else defaultAvatar">
          <img 
            [src]="user.photoUrl" 
            class="user-avatar-image hardware-accelerated" 
            (error)="onImageError($event)"
            alt="Foto de perfil del usuario"
            loading="lazy"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
            width="120"
            height="120"
            decoding="async"
          >
        </ng-container>
        <ng-template #defaultAvatar>
          <img 
            src="assets/default-profile.svg" 
            class="user-avatar-image hardware-accelerated" 
            alt="Avatar por defecto"
            width="120"
            height="120"
            loading="eager"
          >
        </ng-template>
        
        <!-- Botón de carga de foto -->
        <ion-button 
          fill="clear" 
          class="user-photo-upload-button" 
          (click)="fileInput.click()"
        >
          <ion-icon name="camera" slot="icon-only"></ion-icon>
        </ion-button>
        
        <!-- Input de archivo oculto -->
        <input 
          #fileInput 
          type="file" 
          accept="image/*" 
          (change)="onPhotoUpload($event)" 
          style="display: none"
        >
        
        <!-- Botón de edición de perfil -->
        <ion-button 
          fill="clear" 
          class="user-edit-button hardware-accelerated" 
          (click)="editProfile()"
        >
          <ion-icon name="pencil" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
      <h2 class="user-fullname">{{ user.name }}</h2>
      <p class="user-email-text">{{ user.email }}</p>
      <!-- Mostrar ID del usuario para desarrollo -->
      <p class="user-id-text" style="font-family: monospace; background: #f0f0f0; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin: 8px 0;">
        ID: {{ user.id }}
      </p>
      <!-- Indicador de propietario de tienda -->
      <div *ngIf="user.isStoreOwner" class="store-owner-badge" style="display: inline-flex; align-items: center; background: #4CAF50; color: white; padding: 4px 12px; border-radius: 16px; font-size: 12px; margin: 8px 0;">
        <ion-icon name="storefront" style="margin-right: 4px;"></ion-icon>
        Propietario de Tienda
      </div>
    </div>

    <ion-list lines="full" class="user-info-list hardware-accelerated">
      <ion-item>
        <ion-icon name="call-outline" slot="start"></ion-icon>
        <ion-label position="stacked">Teléfono</ion-label>
        <ion-input [(ngModel)]="user.phone" name="phone" type="tel" placeholder="Teléfono"></ion-input>
        <ion-button size="small" fill="solid" color="success" slot="end" (click)="saveProfileField('phone')" style="--padding-start: 8px; --padding-end: 8px; height: 28px; --border-radius: 4px; min-width: 32px;">
          <ion-icon name="save-outline" style="margin: 0;"></ion-icon>
        </ion-button>
      </ion-item>

      <ion-item>
        <ion-icon name="location-outline" slot="start"></ion-icon>
        <ion-label position="stacked">Dirección</ion-label>
        <ion-input [(ngModel)]="user.address" name="address" type="text" placeholder="Dirección"></ion-input>
        <ion-button size="small" fill="solid" color="success" slot="end" (click)="saveProfileField('address')" style="--padding-start: 8px; --padding-end: 8px; height: 28px; --border-radius: 4px; min-width: 32px;">
          <ion-icon name="save-outline" style="margin: 0;"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-list>

    <ion-list lines="full" class="user-menu-list hardware-accelerated">
      <ion-item *ngFor="let item of menuItems; trackBy: trackById" (click)="navigate(item.route)" detail>
        <ion-icon [name]="item.icon" slot="start"></ion-icon>
        <ion-label>{{ item.label }}</ion-label>
      </ion-item>
    </ion-list>

    <div class="user-actions-container">
      <ion-button expand="block" color="danger" class="logout-button hardware-accelerated" (click)="logout()">
        CERRAR SESIÓN
      </ion-button>
    </div>
  </div>

  <!-- Contenido cuando el usuario NO está autenticado -->
  <div *ngIf="!isAuthenticated" class="not-authenticated-container hardware-accelerated">
    <div class="app-logo">
      <div class="logo-container">
        <img [src]="logoUrl" alt="MercAU" class="transparent-logo" (error)="onImageError($event)" loading="eager">
      </div>
      <h1>MercAU</h1>
    </div>
    
    <div class="login-prompt-card hardware-accelerated">
      <ion-icon name="personCircle" class="large-profile-icon"></ion-icon>
      <h2>¡Bienvenido!</h2>
      <p>Inicia sesión para acceder a tu perfil, pedidos y más</p>
      <ion-button expand="block" color="primary" (click)="goToLogin()" class="hardware-accelerated">
        <ion-icon name="log-in-outline" slot="start"></ion-icon>
        Iniciar Sesión
      </ion-button>
      <p class="register-prompt">¿No tienes cuenta? <a (click)="goToRegister()">Regístrate</a></p>
    </div>
  </div>
</ion-content>
